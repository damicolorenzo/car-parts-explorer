services:
  postgres:
    image: postgres:17
    container_name: car-parts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_parts
      POSTGRES_USER: carparts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carparts -d car_parts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
